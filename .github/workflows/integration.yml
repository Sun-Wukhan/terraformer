name: integration

# Live CLI integration tests. These exercise the real terraform/tofu binaries
# against the public registries with NO cloud credentials:
#   - provider auto-install via init
#   - `providers schema -json` conversion, fuzzed over every resource type
#     of several real, current provider releases
#   - OpenTofu registry coverage for every provider source we ship
#   - the show -json -> InstanceState pipeline against synthetic state
#
# The weekly schedule exists so new provider releases (which can introduce
# new schema shapes) get validated continuously.

on:
  push:
    branches: [master, 'revive/**']
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  cli-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: latest
    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: latest
    - name: CLI integration tests
      env:
        TERRAFORMER_INTEGRATION_TEST: 1
      run: go test -count=1 -timeout 30m -v ./terraformutils/...
