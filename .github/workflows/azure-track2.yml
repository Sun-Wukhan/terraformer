name: azure-track2

# Tests for the Azure track-2 SDK migration.
# - azure-unit: always runs, credential-free (build, vet, unit tests).
# - azure-live: runs only when AZURE_* secrets are configured on the repo;
#   exercises the track-2 credential + a read-only list call against real Azure.

on:
  push:
    branches: [master, 'revive/**']
    paths:
      - 'providers/azure/**'
      - '.github/workflows/azure-track2.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [master]
    paths:
      - 'providers/azure/**'
      - '.github/workflows/azure-track2.yml'
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC

jobs:
  azure-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Build Azure provider
      run: go build ./providers/azure/
    - name: Vet Azure provider
      run: go vet ./providers/azure/
    - name: Unit tests (no credentials)
      run: go test -count=1 -v ./providers/azure/

  azure-live:
    runs-on: ubuntu-latest
    if: ${{ secrets.AZURE_CLIENT_ID != '' }}
    env:
      TERRAFORMER_AZURE_LIVE_TEST: 1
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Live track-2 smoke test
      run: go test -count=1 -timeout 20m -v -run 'TestLive' ./providers/azure/
